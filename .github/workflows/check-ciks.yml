name: Check CIKs

# Temporary diagnostic workflow: runs fetch_13f.py --check on a runner
# that can reach SEC EDGAR, so the entity name behind each CIK is printed.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CIK list against EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetch_13f.py --check
